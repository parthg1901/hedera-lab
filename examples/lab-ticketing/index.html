<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>After Hours · Lab ticketing</title><style>
body{font:16px/1.6 system-ui;background:#0d151e;color:#e1eaf2;max-width:760px;margin:70px auto;padding:24px}small{color:#6ee7be;letter-spacing:.15em}h1{font-size:64px;line-height:1.1;margin:18px 0}p{color:#a8bbcc}.card{border:1px solid #344759;border-radius:18px;padding:30px;background:#14232e;margin-top:35px}button{padding:14px 24px;border:0;border-radius:8px;background:#76e4bd;color:#0d2520;font:600 16px system-ui;cursor:pointer;margin:8px 12px 8px 0}button:disabled{opacity:.5;cursor:wait}#status{color:#d9f7e7}footer{margin-top:35px;color:#7e97aa;font-size:13px}
</style></head><body><small>HEDERA LAB / SCENARIO APP</small><h1>After Hours.</h1><p>One ticket. One attendee. A verifiable check-in.</p><div class="card"><small>ADMIT ONE · NFT #1</small><h2>Developer night</h2><p>Claim your test ticket, then record attendance on a consensus topic.</p><button id="buy">Get ticket</button><button id="check-in">Check in</button><p id="status" role="status">Ready</p></div><footer>Test application · Server-side Lab signer adapter · No production wallet connection</footer><script>
for (const [id, action] of [['buy','buy'],['check-in','check-in']]) {
  const button = document.getElementById(id);
  button.addEventListener('click', async () => {
    button.disabled = true;
    document.getElementById('status').textContent = 'Submitting…';
    try {
      const response = await fetch('/api/' + action, { method: 'POST' });
      const result = await response.json();
      document.getElementById('status').textContent = result.message;
    } catch { document.getElementById('status').textContent = 'Network unavailable'; }
    finally { button.disabled = false; }
  });
}
</script></body></html>
