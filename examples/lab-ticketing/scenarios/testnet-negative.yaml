schemaVersion: 1
name: Unassociated recipient rejects NFT transfer
network:
  mode: testnet
fixtures:
  accounts:
    organizer:
      hbar: 5
    customer:
      hbar: 5
  tokens:
    ticket:
      treasury: organizer
      supply: 1
  topics:
    - attendance
timeoutMs: 30000
pollIntervalMs: 500
steps:
  - id: rejected-transfer
    operation: &a1
      type: transferNft
      actor: organizer
      to: customer
      token: ticket
      serial: 1
    expectStatus: TOKEN_NOT_ASSOCIATED_TO_ACCOUNT
  - id: unchanged-owner
    assert:
      type: nftOwner
      token: ticket
      serial: 1
      account: organizer
  - id: associate
    operation:
      type: associate
      actor: customer
      token: ticket
  - id: transfer
    operation: *a1
  - id: ownership
    assert:
      type: nftOwner
      token: ticket
      serial: 1
      account: customer
