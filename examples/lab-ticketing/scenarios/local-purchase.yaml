schemaVersion: 1
name: Local ticket purchase and check-in
network:
  mode: local
  nodeAddress: 127.0.0.1:35211
  nodeAccountId: 0.0.3
  mirrorUrl: http://127.0.0.1:38081
fixtures:
  accounts:
    organizer:
      hbar: 5
    customer:
      hbar: 5
  tokens:
    ticket:
      treasury: organizer
      supply: 1
  topics:
    - attendance
timeoutMs: 30000
pollIntervalMs: 500
server:
  command: node server.mjs
  url: http://127.0.0.1:3000
  timeoutMs: 10000
steps:
  - id: open
    browser:
      type: goto
      path: /
  - id: buy
    browser:
      type: click
      selector: "#buy"
  - id: purchase-ui
    assert:
      type: text
      selector: "#status"
      equals: Ticket purchased
  - id: ownership
    assert:
      type: nftOwner
      token: ticket
      serial: 1
      account: customer
  - id: check-in
    browser:
      type: click
      selector: "#check-in"
  - id: attendance-ui
    assert:
      type: text
      selector: "#status"
      equals: Checked in
  - id: attendance-record
    assert:
      type: topicMessage
      topic: attendance
      message: ticket:1:customer
