schemaVersion: 1
name: Grant recipients receive their approved amounts
network:
  mode: testnet
fixtures:
  accounts:
    treasury: {hbar: 5}
    alice: {hbar: 1}
    bob: {hbar: 1}
  tokens: {}
  topics: [audit]
timeoutMs: 8000
pollIntervalMs: 500
steps:
  - id: first-grant
    planOperation: {file: payout-plan.json, index: 0}
  - id: second-grant
    planOperation: {file: payout-plan.json, index: 1}
  - id: record-batch
    planOperation: {file: payout-plan.json, index: 2}
  - id: alice-approved-amount
    assert: {type: hbarBalance, account: alice, min: 1.75, max: 1.75}
  - id: bob-approved-amount
    assert: {type: hbarBalance, account: bob, min: 1.25, max: 1.25}
  - id: batch-recorded
    assert: {type: topicMessage, topic: audit, message: 'grants:community-2026-09:count:2'}
